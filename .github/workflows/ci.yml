name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # macOS 26 SDK (Speech, Foundation Models) needs the macos-26 image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: swift format lint --recursive --strict Package.swift Sources Tests scripts
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
